name: Deliver existing release to Microsoft Store
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested release tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: microsoft-store-delivery
  cancel-in-progress: false
jobs:
  store:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: microsoft-store
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      FIRST_PUBLICATION: ${{ vars.STORE_FIRST_PUBLICATION_COMPLETE }}
      PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
      TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      SELLER_ID: ${{ secrets.SELLER_ID }}
      CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify submission safety guards
        run: python scripts/test-store-submission.py
      - name: Download and verify the immutable published package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:FIRST_PUBLICATION -ne 'true' -or $env:PRODUCT_ID -ne '9PN00KMTMDS1') { throw 'Official Store identity and first publication are required' }
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          $packageName = 'Windows-Sticky-Notes-' + $env:TAG.Substring(1) + '.msixupload'
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern $packageName --pattern SHA256.txt --dir store-package
          if ($LASTEXITCODE) { throw 'Official release download failed' }
          $hashLines = @(Get-Content store-package/SHA256.txt | Where-Object { $_ -match ('^[a-fA-F0-9]{64}  ' + [regex]::Escape($packageName) + '$') })
          if ($hashLines.Count -ne 1) { throw 'Expected one published package checksum' }
          if ((Get-FileHash (Join-Path store-package $packageName) -Algorithm SHA256).Hash -ne $hashLines[0].Substring(0,64)) { throw 'Published package checksum mismatch' }
      - name: Submit the same verified release package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($key in 'TENANT_ID','SELLER_ID','CLIENT_ID','CLIENT_SECRET') {
            if (![Environment]::GetEnvironmentVariable($key)) { throw "Missing Store credential: $key" }
          }
          $package = @(Get-ChildItem store-package -Filter '*.msixupload')
          if ($package.Count -ne 1) { throw 'Expected one official package' }
          python scripts/submit-store.py --package $package[0].FullName --product $env:PRODUCT_ID
          if ($LASTEXITCODE) { throw 'Store submission failed' }
          "Submitted immutable release $env:TAG for product $env:PRODUCT_ID. Public certification must still be verified." >> $env:GITHUB_STEP_SUMMARY
